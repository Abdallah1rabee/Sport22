<style>

/* Layout: newspaper front page. Wordmark with a jersey-number block is the one bold move; fixture-style date tiles mark the feed. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #0B1220;
  --muted: #566074;
  --line: #D6DBE3;
  --accent: #1747E0;
  --accent-ink: #FFFFFF;
  --warn: #A84F08;
  --warn-bg: #FBEEDF;
  --ok: #0B7A4B;
  --ok-bg: #E3F1EA;
  --logo: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --display: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F18;
    --surface: #121A27;
    --ink: #E8ECF3;
    --muted: #93A0B5;
    --line: #223049;
    --accent: #7399FF;
    --accent-ink: #0A0F18;
    --warn: #F2A862;
    --warn-bg: #2E2114;
    --ok: #4FD39A;
    --ok-bg: #12301F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F18;
  --surface: #121A27;
  --ink: #E8ECF3;
  --muted: #93A0B5;
  --line: #223049;
  --accent: #7399FF;
  --accent-ink: #0A0F18;
  --warn: #F2A862;
  --warn-bg: #2E2114;
  --ok: #4FD39A;
  --ok-bg: #12301F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.8;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 18px 14px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; direction: ltr; font-family: var(--logo); font-style: italic; font-weight: 800; line-height: 1; text-transform: uppercase; }
.logo .w-sport { font-size: clamp(2.2rem, 7vw, 3.1rem); letter-spacing: .01em; }
.logo .w-num { font-size: clamp(2.2rem, 7vw, 3.1rem); background: var(--accent); color: var(--accent-ink); padding: .04em .2em .02em; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search { width: 14rem; max-width: 100%; border: 1.5px solid var(--line); background: var(--surface); padding: 6px 12px; line-height: 1.6; }
.search:focus { border-color: var(--accent); }
.deskLink { font-weight: 600; text-decoration: none; border: 1.5px solid var(--ink); padding: 5px 14px; line-height: 1.6; }
.deskLink:hover { background: var(--ink); color: var(--bg); }
.cats { display: flex; gap: 2px; overflow-x: auto; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.cats a { white-space: nowrap; text-decoration: none; padding: 9px 14px; font-weight: 600; font-size: .9375rem; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.cats a:hover { color: var(--accent); }
.cats a[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }

/* Shared bits */
.tag { font-size: .8125rem; font-weight: 600; color: var(--accent); letter-spacing: .02em; text-decoration: none; }
.meta { font-size: .8125rem; color: var(--muted); }
.sec { font-family: var(--display); font-weight: 800; font-size: 1.25rem; margin: 0 0 8px; line-height: 1.5; }
.btn { display: inline-block; border: 1.5px solid var(--ink); background: transparent; padding: 6px 18px; cursor: pointer; font-weight: 600; text-decoration: none; line-height: 1.6; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn.danger:hover { background: var(--warn); color: var(--bg); }
.btn[disabled] { opacity: .55; cursor: default; }
.empty { border: 1.5px dashed var(--line); padding: 22px; color: var(--muted); margin-block: 28px; }
.empty p { margin: 0 0 12px; }
.note { font-size: .875rem; color: var(--muted); margin: 0 0 12px; }

/* Front page */
.front { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 32px; padding-block: 28px; border-bottom: 1px solid var(--line); }
.lead h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.9rem); line-height: 1.4; margin: 6px 0 12px; text-wrap: balance; }
.lead h1 a { text-decoration: none; }
.lead h1 a:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.lead .sum { color: var(--muted); font-size: 1.125rem; margin: 0 0 10px; max-width: 44rem; }
.side { display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.side .item { padding-block: 14px; border-bottom: 1px solid var(--line); }
.side h3 { font-family: var(--display); font-weight: 600; font-size: 1.1875rem; line-height: 1.55; margin: 2px 0 2px; text-wrap: balance; }
.side h3 a, .feed h3 a { text-decoration: none; }
.side h3 a:hover, .feed h3 a:hover { text-decoration: underline; text-underline-offset: 4px; }
.feedHead { padding-top: 26px; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.stamp { text-align: center; border: 1.5px solid var(--ink); align-self: start; line-height: 1; padding-block: 8px 6px; background: var(--surface); }
.stamp b { display: block; font-family: var(--logo); font-style: italic; font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.stamp span { display: block; font-size: .75rem; color: var(--muted); margin-top: 3px; }
.feed h3 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.55; margin: 0; text-wrap: balance; }
.feed p { margin: 2px 0 0; color: var(--muted); font-size: .9375rem; line-height: 1.75; }
.pageHead { padding-block: 26px 4px; }
.pageHead h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 4.4vw, 2.3rem); margin: 0; line-height: 1.4; }

/* Article */
.article { max-width: 42rem; padding-top: 26px; }
.article h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 4.8vw, 2.7rem); line-height: 1.4; margin: 4px 0 8px; text-wrap: balance; }
.article .meta { margin-bottom: 22px; }
.article p { margin: 0 0 1.1em; font-size: 1.1875rem; line-height: 2; }
.article p.first { font-weight: 500; font-size: 1.25rem; }
.articleActions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.more { margin-top: 36px; }

/* Desk */
.deskGrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; padding-top: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; }
.panel + .panel { margin-top: 20px; }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0 0 10px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; min-width: 0; }
.field label { font-weight: 600; font-size: .9375rem; }
.field input, .field select, .field textarea { background: var(--bg); border: 1.5px solid var(--line); padding: 8px 12px; width: 100%; min-width: 0; line-height: 1.8; }
.field textarea { resize: vertical; min-height: 260px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.count { font-size: .8125rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.checks { position: sticky; top: 16px; }
.checks ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 8px; font-size: .9375rem; line-height: 1.7; padding: 8px 10px; }
.checks li.bad { background: var(--warn-bg); }
.checks li.good { background: var(--ok-bg); }
.mk { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; font-size: .8125rem; font-weight: 700; line-height: 1; margin-top: .2rem; }
.good .mk { background: var(--ok); color: var(--bg); }
.bad .mk { background: var(--warn); color: var(--bg); }
.sum2 { font-weight: 600; margin: 0; }
.manage { list-style: none; padding: 0; margin: 0; }
.manage li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.manage .t { font-weight: 600; min-width: 0; }
.manage .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.manage .btn { padding: 3px 14px; font-size: .875rem; }
.busy { padding: 60px 0; text-align: center; color: var(--muted); font-size: 1.125rem; }

/* Footer */
.foot { margin-top: 44px; padding-top: 18px; border-top: 2px solid var(--ink); display: flex; gap: 12px 28px; flex-wrap: wrap; justify-content: space-between; font-size: .875rem; color: var(--muted); }
.foot nav { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.foot a { color: var(--ink); }

.toast { position: fixed; inset-inline: 0; bottom: 0; display: flex; justify-content: center; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.toast div { background: var(--ink); color: var(--bg); padding: 9px 20px; font-weight: 500; }
@media (max-width: 820px) {
  .front, .deskGrid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .checks { position: static; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .feed li { grid-template-columns: 3.4rem minmax(0, 1fr); gap: 12px; }
  .manage li { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .btn, .deskLink { transition: background .15s, color .15s; } }

/* Media, links, thumbnails */
.media { margin: 0 0 22px; }
.media img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: cover; background: var(--line); }
.lead .media { margin: 0 0 14px; }
.video { position: relative; aspect-ratio: 16 / 9; margin: 8px 0 24px; background: #000; }
.video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video video { object-fit: contain; }
.article p a { color: var(--accent); font-weight: 600; word-break: break-word; }
.refs { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.refs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.refs a { color: var(--accent); font-weight: 600; word-break: break-word; }
.feedRow { display: flex; gap: 14px; align-items: flex-start; }
.feedRow > div { flex: 1; min-width: 0; }
.thumb { display: block; flex: 0 0 7.5rem; width: 7.5rem; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); }
@media (max-width: 820px) { .thumb { flex-basis: 5.5rem; width: 5.5rem; } }

/* Engagement: reactions, polls, predictions */
.engage { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.reacts { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 22px; }
.react { border: 1.5px solid var(--ink); background: transparent; padding: 6px 14px; cursor: pointer; font-size: 1.15rem; line-height: 1.4; display: inline-flex; gap: 8px; align-items: center; }
.react b { font-size: .9rem; font-variant-numeric: tabular-nums; }
.react:hover { background: var(--surface); }
.react.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.react[disabled] { cursor: default; }
.poll, .match, .board { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 16px; }
.poll h3, .match h3 { font-family: var(--display); font-size: 1.2rem; margin: 2px 0 10px; line-height: 1.6; }
.opt { display: block; width: 100%; text-align: start; position: relative; border: 1.5px solid var(--ink); background: transparent; padding: 8px 14px; margin-bottom: 8px; cursor: pointer; overflow: hidden; }
.opt.static { cursor: default; }
.opt .fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); opacity: .2; }
.opt > span { position: relative; display: flex; justify-content: space-between; gap: 12px; }
.opt.mine { border-color: var(--accent); font-weight: 600; }
.pform { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.pform input { border: 1.5px solid var(--line); background: var(--bg); padding: 6px 10px; min-width: 0; }
.pform input[type=text] { flex: 1 1 10rem; }
.pform .sc { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
@media (max-width: 520px) { .pform input[type=text] { flex-basis: 100%; } }
.pform input[type=number] { width: 4.5rem; text-align: center; }
.final { font-weight: 600; margin: 0 0 8px; }
.lb { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.lb li { counter-increment: r; display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto auto; gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); align-items: baseline; }
.lb li::before { content: counter(r); font-family: var(--logo); font-style: italic; font-weight: 800; font-size: 1.3rem; }
@media (max-width: 820px) { .lb li { grid-template-columns: 1.6rem minmax(0, 1fr) auto; } .lb li .meta { display: none; } }

/* Today's matches strip */
.today { margin-top: 14px; }
.today .thead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.today h2 { font-family: var(--display); font-weight: 800; font-size: 1.05rem; margin: 0; line-height: 1.5; }
.today .tnote { font-size: .75rem; color: var(--muted); }
.tstrip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.tm { flex: 0 0 12rem; border: 1.5px solid var(--ink); background: var(--surface); padding: 8px 12px; }
.tm .tc { font-size: .75rem; color: var(--muted); }
.tm .tt { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; line-height: 1.7; }
.tm .tt b { font-family: var(--logo); font-style: italic; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.tm .ts { font-size: .8125rem; margin-top: 4px; font-weight: 600; color: var(--accent); }
.tm.live { border-color: var(--warn); }
.tm.live .ts { color: var(--warn); }
.tm.ft .ts { color: var(--muted); }
.dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--warn); margin-inline-end: 6px; }
@media (prefers-reduced-motion: no-preference) { .dot { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .25; } } }

</style>

      engageEl(a),
      state.canWrite ? h('div', { class: 'articleActions' }, h('a', { class: 'btn', href: '#write-' + a.id }, 'تعديل المادة')) : null));
    if (more.length) {
      box.append(h('section', { class: 'more' }, h('h2', { class: 'sec' }, 'اقرأ أيضاً'), h('ul', { class: 'feed' }, more.map(feedItem))));
    }
    return box;
  }
  function aboutView() {
    var box = document.createDocumentFragment();
    box.append(h('div', { class: 'pageHead' }, h('h1', null, 'عن الموقع')));
    box.append(h('div', { class: 'article' }, paras(DATA.site.about).map(function (p) { return h('p', null, p); })));
    return box;
  }

  
  function renderMain() {
    var r = route();
    elMain.replaceChildren();
    if (state.status === 'loading') { elMain.append(h('div', { class: 'busy' }, 'جار التحميل...')); return; }
    if (state.status === 'error') { elMain.append(h('div', { class: 'empty' }, h('p', null, 'تعذر تحميل مواد الموقع الآن. حدّث الصفحة بعد قليل.'))); return; }
    var v, title = 'SPORT 22';
    if (r.name === 'article') { v = articleView(r.id); var a = find(r.id); if (a) title = a.title + ' | SPORT 22'; }
    else if (r.name === 'cat') { v = catView(r.slug); title = catName(r.slug) + ' | SPORT 22'; }
    else if (r.name === 'about') { v = aboutView(); title = 'عن الموقع | SPORT 22'; }
    else if (r.name === 'predict') { v = predictView(); title = 'توقّع النتيجة | SPORT 22'; }
    else v = homeView();
    document.title = title;
    elMain.append(v);
  }
  function renderAll() { renderNav(); renderToday(); renderMain(); renderFoot(); }
  /* Visit counter (GoatCounter): count every page view, including each article hash */
  function track(n) {
    var gc = window.goatcounter;
    if (gc && typeof gc.count === 'function') {
      try { gc.count({ path: location.pathname + location.hash, title: document.title }); } catch (e) {}
    } else if ((n || 0) < 10) {
      setTimeout(function () { track((n || 0) + 1); }, 500);
    }
  }
  window.addEventListener('hashchange', function () { renderAll(); window.scrollTo(0, 0); track(); });
  build(); renderAll();
  fetch('today.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { TODAY = d; renderToday(); })
    .catch(function () {});
  setInterval(renderToday, 60000);
  fetch('articles.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
    .then(function (d) { DATA = { site: d.site || {}, articles: d.articles || [], matches: d.matches || [] }; state.status = 'ready'; renderAll(); track(); })
    .catch(function () { state.status = 'error'; renderAll(); });
})();
</script>
</body>
</html>
